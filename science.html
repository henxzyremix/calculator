<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#adc6ff",
                        "on-primary": "#002e6a",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#3a485c",
                        "secondary-fixed-dim": "#b9c7e0",
                        "outline-variant": "#424754",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#2a3548",
                        "background": "#081425",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#adc6ff",
                        "on-secondary-container": "#abb9d2",
                        "surface": "#081425",
                        "on-tertiary-container": "#3e2400",
                        "on-secondary": "#233144",
                        "tertiary-fixed": "#ffddb8",
                        "secondary-fixed": "#d5e3fd",
                        "on-primary-fixed": "#001a42",
                        "surface-variant": "#2a3548",
                        "surface-bright": "#2f3a4c",
                        "outline": "#8c909f",
                        "surface-dim": "#081425",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-primary-container": "#00285d",
                        "inverse-primary": "#005ac2",
                        "surface-container-low": "#111c2d",
                        "surface-container-lowest": "#040e1f",
                        "on-error": "#690005",
                        "tertiary": "#ffb95f",
                        "surface-container": "#152031",
                        "primary-container": "#4d8eff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "primary": "#adc6ff",
                        "on-surface": "#d8e3fb",
                        "secondary-container": "#3c4a5e",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-on-surface": "#263143",
                        "on-surface-variant": "#c2c6d6",
                        "surface-container-high": "#1f2a3c",
                        "error-container": "#93000a",
                        "on-tertiary": "#472a00",
                        "on-secondary-fixed": "#0d1c2f",
                        "on-background": "#d8e3fb",
                        "secondary": "#b9c7e0",
                        "on-primary-fixed-variant": "#004395",
                        "tertiary-container": "#ca8100",
                        "inverse-surface": "#d8e3fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "grid-margin": "24px",
                        "button-gap": "12px",
                        "touch-target-min": "64px",
                        "display-padding": "32px"
                    },
                    "fontFamily": {
                        "history-item": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "button-label": ["Inter"]
                    },
                    "fontSize": {
                        "history-item": ["18px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg-mobile": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "display-lg": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "button-label": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #081425;
            color: #d8e3fb;
        }
        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .scientific-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }
        .inner-shadow-press:active {
            box-shadow: inset 0px 4px 8px rgba(0,0,0,0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
    <header class="docked full-width top-0 bg-background dark:bg-background flex justify-between items-center w-full px-grid-margin py-4 z-50">
    <div class="flex items-center gap-4">
      <button class="text-primary dark:text-primary hover:bg-surface-container dark:hover:bg-surface-container p-2 rounded-full transition-transform active:scale-95 duration-100">
        <span class="material-symbols-outlined" data-icon="menu">menu</span>
      </button>
      <h1 class="text-label-sm font-label-sm font-bold tracking-widest uppercase text-primary dark:text-primary">Calculator By Ramy</h1>
    </div>
    <a class="text-primary dark:text-primary hover:bg-surface-container dark:hover:bg-surface-container p-2 rounded-full transition-transform active:scale-95 duration-100" href="history.html">
        <span class="material-symbols-outlined" data-icon="history">history</span>
    </a>
    </header>
<!-- Main Content Canvas -->
    <main class="h-[calc(88vh-140px)] mt-16 mb-24 flex flex-col justify-between px-grid-margin overflow-hidden">
        <section class="flex flex-col justify-center items-end flex-1 space-y-2">
            <div class="w-full text-right overflow-x-auto whitespace-nowrap scrollbar-hide opacity-60">
                <span class="font-history-item text-history-item text-secondary">0
                </span>
            </div>
            <div class="w-full text-right overflow-x-auto whitespace-nowrap scrollbar-hide">
                <span class="font-display-lg-mobile text-display-lg-mobile text-on-surface">0
                </span>
            </div>
        </section>
    <!-- Scientific Functions Row (Scrollable or Grid) -->
        <section class="mb-button-gap">
            <div class="scientific-grid">
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">sin</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">cos</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">tan</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">log</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">ln</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">π</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">e</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">^</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">√</button>
                <button class="bg-secondary-container text-secondary font-button-label text-[16px] h-12 flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">!</button>
            </div>
        </section>
    <!-- Main Keypad -->
    <section class="calculator-grid pb-2">
    <!-- Row 1 -->
        <button class="bg-surface-container-highest text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">C</button>
        <button class="bg-surface-container-highest text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">( )</button>
        <button class="bg-surface-container-highest text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">%</button>
        <button class="bg-secondary-container text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">÷</button>
    <!-- Row 2 -->
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">7</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">8</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">9</button>
        <button class="bg-secondary-container text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">×</button>
    <!-- Row 3 -->
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">4</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">5</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">6</button>
        <button class="bg-secondary-container text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">−</button>
    <!-- Row 4 -->
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">1</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">2</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">3</button>
        <button class="bg-secondary-container text-primary font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">+</button>
        <!-- Row 5 -->
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">0</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">.</button>
        <button class="bg-surface-container text-on-surface font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">
            <span class="material-symbols-outlined" data-icon="backspace">backspace</span>
        </button>
        <button class="bg-primary-container text-on-primary-container font-button-label h-touch-target-min flex items-center justify-center rounded-xl inner-shadow-press active:scale-95 transition-all">=</button>
    </section>
    </main>
<!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center py-3 px-4 bg-surface-container dark:bg-surface-container docked full-width rounded-t-xl shadow-[0px_-8px_24px_rgba(0,0,0,0.3)]">
    <!-- Basic -->
    <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-6 py-1 hover:text-primary dark:hover:text-primary active:scale-95 transition-all duration-150" href="index.html">
        <span class="material-symbols-outlined" data-icon="calculate">calculate</span>
        <span class="text-label-sm font-label-sm">Basic</span>
    </a>
    <!-- Scientific (Active) -->
    <a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full px-6 py-1 active:scale-95 transition-all duration-150" href="science.html">
        <span class="material-symbols-outlined" data-icon="science" style="font-variation-settings: 'FILL' 1;">science</span>
        <span class="text-label-sm font-label-sm">Scientific</span>
    </a>
    <!-- History -->
    <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-6 py-1 hover:text-primary dark:hover:text-primary active:scale-95 transition-all duration-150" href="history.html">
        <span class="material-symbols-outlined" data-icon="history">history</span>
        <span class="text-label-sm font-label-sm">History</span>
    </a>
    </nav>
    <script src="/Calc/Javascript/science.js"></script>
    <script src="/Calc/Javascript/history.js"></script>
</body>
</html>
